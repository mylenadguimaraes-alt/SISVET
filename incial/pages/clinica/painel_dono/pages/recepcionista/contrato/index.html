<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">


    <title>Cadastrar contrato de recepcionista</title>

    <link rel="stylesheet" href="css/style.css">
    <script src="js/mascara.js" defer></script>
</head>
<body>

    <main class="container">
        <section class="formulario">

            <div class="titulo">
                <h1>Cadastrar contrato</h1>
                <p>
                    Vincule uma recepcionista a uma clínica
                    preenchendo os dados do contrato.
                </p>
            </div>

            <form action="../../../../../../../bd_conexao/php/cadastro_contrato_recepcionista.php" method="post" id="formContrato">

                <fieldset>
                    <legend>Identificação</legend>

                    <div class="campo">
                        <label for="cpf_recepcionista">
                            CPF da recepcionista
                        </label>

                        <input
                            type="text"
                            id="cpf_recepcionista"
                            name="cpf_recepcionista"
                            placeholder="000.000.000-00"
                            maxlength="14"
                            required
                        >
                    </div>

                    <div class="campo">
                        <label for="cnpj_clinica">
                            CNPJ da clínica
                        </label>

                        <input
                            type="text"
                            id="cnpj_clinica"
                            name="cnpj_clinica"
                            placeholder="00.000.000/0000-00"
                            maxlength="18"
                            required
                        >
                    </div>
                </fieldset>

                <fieldset>
                    <legend>Dados do contrato</legend>

                    <div class="campo">
                        <label for="cargo">Cargo</label>

                        <input
                            type="text"
                            id="cargo"
                            name="cargo"
                            value="Recepcionista"
                            required
                        >
                    </div>

                    <div class="campo">
                        <label for="tipo_contrato">
                            Tipo de contrato
                        </label>

                        <select
                            id="tipo_contrato"
                            name="tipo_contrato"
                            required
                        >
                            <option value="">Selecione</option>
                            <option value="CLT">CLT</option>
                            <option value="PJ">Pessoa Jurídica (PJ)</option>
                            <option value="Temporario">Temporário</option>
                            <option value="Estagio">Estágio</option>
                            <option value="Outro">Outro</option>
                        </select>
                    </div>

                    <div class="campo">
                        <label for="data_inicio">Data de início</label>

                        <input
                            type="date"
                            id="data_inicio"
                            name="data_inicio"
                            required
                        >
                    </div>

                    <div class="campo">
                        <label for="data_fim">
                            Data de término
                            <span>(opcional)</span>
                        </label>

                        <input
                            type="date"
                            id="data_fim"
                            name="data_fim"
                        >
                    </div>

                    <div class="campo">
                        <label for="carga_horaria_semanal">
                            Carga horária semanal
                        </label>

                        <input
                            type="number"
                            id="carga_horaria_semanal"
                            name="carga_horaria_semanal"
                            min="1"
                            max="168"
                            placeholder="Ex.: 40"
                        >
                    </div>

                    <div class="campo campo-completo">
                        <label for="observacoes">Observações</label>

                        <textarea
                            id="observacoes"
                            name="observacoes"
                            rows="4"
                            placeholder="Informações adicionais sobre o contrato..."
                        ></textarea>
                    </div>
                </fieldset>

                <div class="botoes">
                    <button type="reset" class="botao-secundario">
                        Limpar
                    </button>

                    <button type="submit" class="botao-principal">
                        Cadastrar contrato
                    </button>
                </div>

            </form>
        </section>
    </main>
    <script src="js/mascara.js"></script>

</body>
</html>
