
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Clínicas suspensas | SISVET</title>

    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <main class="pagina-clinicas">
   
        <div class="topo">
            <div>
                <h1>Clínicas suspensas</h1>
                <p>Clínicas que estão com o acesso suspenso no sistema.</p>
            </div>
        </div>

        <div class="pesquisa">
            <input
                type="search"
                id="pesquisaClinica"
                placeholder="Pesquisar clínica pelo nome..."
                aria-label="Pesquisar clínica pelo nome"
            >
        </div>

        <section class="lista-clinicas" id="listaClinicas" aria-live="polite">
            <p>Carregando clínicas suspensas...</p>
        </section>


    </main>

    <script src="js/suspensas.js"></script>

</body>
</html>
