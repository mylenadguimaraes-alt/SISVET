<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>SISVET - Atendimento Veterinário</title>
    <link rel="stylesheet" href="estilo.css">
</head>
<body>

    <header>
        <h1>SISVET | Saúde Veterinária</h1>
        <nav>
            <a href="agenda.html">Agenda</a>
            <a href="atendimento.html">Atendimento</a>
            <a href="historico.html">Histórico</a>
        </nav>
    </header>

    <div class="container">
        <h2>Atendimento do Pet</h2>

        <p>
            Horário:<br>
            <input type="text" id="horario" placeholder="Ex: 14:00"><br>

            Nome do Animal:<br>
            <input type="text" id="nome" placeholder="Ex: Max"><br>

            Queixa / Motivo:<br>
            <input type="text" id="queixa"><br>

            Anamnese (Sintomas e Histórico):<br>
            <textarea id="anamnese" rows="4"></textarea><br>

            Diagnóstico:<br>
            <textarea id="diagnostico" rows="4"></textarea><br>

            Procedimentos Realizados:<br>
            <textarea id="procedimentos" rows="3"></textarea><br>

            Observações:<br>
            <input type="text" id="obs"><br>

            <button onclick="finalizar()">Finalizar Consulta</button>
        </p>
    </div>

    <footer>
        <p>SISVET - Sistema Integrado de Saúde Veterinária &copy; 2026</p>
    </footer>

    <script>
        function finalizar() {
            var horario = document.getElementById("horario").value;
            var nome = document.getElementById("nome").value;
            var queixa = document.getElementById("queixa").value;
            var anamnese = document.getElementById("anamnese").value;
            var diagnostico = document.getElementById("diagnostico").value;
            var procedimentos = document.getElementById("procedimentos").value;
            var obs = document.getElementById("obs").value;

            if (nome == "") {
                alert("Por favor, preencha pelo menos o nome do animal!");
                return;
            }

            var hoje = new Date();
            var dataTexto = hoje.getDate() + "/" + (hoje.getMonth() + 1) + "/" + hoje.getFullYear();

            var consulta = {
horario: horario,
nome: nome,
data: dataTexto,
queixa: queixa,
anamnese: anamnese,
diagnostico: diagnostico,
procedimentos: procedimentos,
obs: obs
};

var historico = JSON.parse(localStorage.getItem("historicoConsultas"));
if (historico == null) {
historico = [];
}

historico.push(consulta);
localStorage.setItem("historicoConsultas", JSON.stringify(historico));

alert("Atendimento de " + nome + " finalizado e salvo no Histórico!");

document.getElementById("horario").value = "";
 document.getElementById("nome").value = "";
document.getElementById("queixa").value = "";
document.getElementById("anamnese").value = "";
document.getElementById("diagnostico").value = "";
document.getElementById("procedimentos").value = "";
document.getElementById("obs").value = "";
}
</script>

</body>
</html>
