
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SISVET - Agenda da Clínica</title>
    <link rel="stylesheet" href="estilo.css">
</head>
<body>

<header>
    <h1>SISVET | Saúde Veterinária</h1>
    <nav>
        <a href="agenda.html">Agenda</a>
        <a href="atendimento.html">Atendimento</a>
        <a href="historico.html">Histórico</a>
    </nav>
</header>

<main class="container">
    <h2>Agenda do Dia</h2>

    <h3>Novo Agendamento</h3>

    <form id="formAgenda">
        <label for="horario">Horário:</label>
        <input type="text" id="horario" placeholder="Ex: 14:00" required>

        <label for="pet">Nome do Pet:</label>
        <input type="text" id="pet" placeholder="Ex: Rex" required>

        <label for="tutor">Tutor:</label>
        <input type="text" id="tutor" placeholder="Ex: João" required>

        <button type="submit">Agendar</button>
    </form>

    <hr class="separador">

    <h3>Consultas Agendadas</h3>

    <div class="table-responsive">
        <table id="tabela">
            <thead>
                <tr>
                    <th>Horário</th>
                    <th>Pet</th>
                    <th>Tutor</th>
                    <th>Ação</th>
                </tr>
            </thead>
            <tbody id="corpoTabela"></tbody>
        </table>
    </div>
</main>

<footer>
    <p>SISVET - Sistema Integrado de Saúde Veterinária &copy; 2026</p>
</footer>

<script>
    const formAgenda = document.getElementById("formAgenda");
    const corpoTabela = document.getElementById("corpoTabela");

    function carregarAgenda() {
        const agendamentos = JSON.parse(
            localStorage.getItem("agendamentosSISVET") || "[]"
        );

        corpoTabela.innerHTML = "";

        agendamentos.forEach((agendamento, indice) => {
            const linha = document.createElement("tr");

            [agendamento.horario, agendamento.pet, agendamento.tutor]
                .forEach(texto => {
                    const celula = document.createElement("td");
                    celula.textContent = texto;
                    linha.appendChild(celula);
                });

            const celulaAcao = document.createElement("td");
            const botao = document.createElement("button");

            botao.textContent = "Cancelar";
            botao.className = "botao-perigo";
            botao.type = "button";

            botao.addEventListener("click", () => {
                cancelarAgendamento(indice);
            });

            celulaAcao.appendChild(botao);
            linha.appendChild(celulaAcao);
            corpoTabela.appendChild(linha);
        });
    }

    formAgenda.addEventListener("submit", function(evento) {
        evento.preventDefault();

        const horario = document.getElementById("horario").value.trim();
        const pet = document.getElementById("pet").value.trim();
        const tutor = document.getElementById("tutor").value.trim();

        if (!horario || !pet || !tutor) {
            alert("Preencha todos os campos do agendamento!");
            return;
        }

        const agendamentos = JSON.parse(
            localStorage.getItem("agendamentosSISVET") || "[]"
        );

        agendamentos.push({ horario, pet, tutor });

        localStorage.setItem(
            "agendamentosSISVET",
            JSON.stringify(agendamentos)
        );

        formAgenda.reset();
        carregarAgenda();

        alert("Agendamento realizado com sucesso!");
    });

    function cancelarAgendamento(indice) {
        if (!confirm("Deseja cancelar este agendamento?")) {
            return;
        }

        const agendamentos = JSON.parse(
            localStorage.getItem("agendamentosSISVET") || "[]"
        );

        agendamentos.splice(indice, 1);

        localStorage.setItem(
            "agendamentosSISVET",
            JSON.stringify(agendamentos)
        );

        carregarAgenda();
    }

    carregarAgenda();
</script>

</body>
</html>
