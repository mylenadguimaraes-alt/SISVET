<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>SISVET - Agenda da Clínica</title>
    <link rel="stylesheet" href="estilo.css">
</head>
<body>

    <header>
        <h1>SISVET | Saúde Veterinária</h1>
        <nav>
            <a href="agenda.html">Agenda</a>
            <a href="atendimento.html">Atendimento</a>
            <a href="historico.html">Histórico</a>
        </nav>
    </header>

    <div class="container">
        <h2>Agenda do Dia</h2>

        <h3>Novo Agendamento</h3>
        <p>
            <label>Horário:</label>
            <input type="text" id="horario" placeholder="Ex: 14:00">

            <label>Nome do Pet:</label>
            <input type="text" id="pet" placeholder="Ex: Rex">

            <label>Tutor:</label>
            <input type="text" id="tutor" placeholder="Ex: João">

            <button onclick="adicionar()">Agendar</button>
        </p>

        <hr style="margin: 20px 0;">

        <h3>Consultas Agendadas</h3>
        <table id="tabela">
            <tr>
                <th>Horário</th>
                <th>Pet</th>
                <th>Tutor</th>
                <th>Ação</th>
            </tr>
        </table>
    </div>

    <footer>
        <p>SISVET - Sistema Integrado de Saúde Veterinária &copy; 2026</p>
    </footer>

    <script>
        function adicionar() {
            var h = document.getElementById("horario").value;
            var p = document.getElementById("pet").value;
            var t = document.getElementById("tutor").value;

            if (h == "" || p == "") {
                alert("Preencha o horário e o nome do pet!");
                return;
            }

            var tabela = document.getElementById("tabela");
            var linha = tabela.insertRow();

            var c1 = linha.insertCell(0);
            var c2 = linha.insertCell(1);
            var c3 = linha.insertCell(2);
            var c4 = linha.insertCell(3);

            c1.innerHTML = h;
            c2.innerHTML = p;
            c3.innerHTML = t;
            c4.innerHTML = '<button style="background-color: #dc3545;" onclick="deletar(this)">Cancelar</button>';

            document.getElementById("horario").value = "";
            document.getElementById("pet").value = "";
            document.getElementById("tutor").value = "";
        }

        function deletar(botao) {
            var linha = botao.parentNode.parentNode;
            linha.remove();
        }
    </script>

</body>
</html>
