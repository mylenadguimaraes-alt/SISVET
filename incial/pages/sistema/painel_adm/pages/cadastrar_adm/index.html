<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastrar Administrador - SISVET</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <main class="container">
        <header class="cabecalho">
            <h1>Novo Administrador</h1>
            <p>Preencha os dados para registrar um novo acesso administrativo.</p>
        </header>

        <!-- Exibição de mensagens via parâmetro GET -->
        <div id="mensagem-container"></div>

        <form action="../../../../../../bd_conexao/php/cadastrar_adm.php" method="POST">
            <div class="campo">
                <label for="nome_completo">Nome Completo *</label>
                <input type="text" id="nome_completo" name="nome_completo" required placeholder="Digite o nome completo">
            </div>

            <div class="campo">
                <label for="email">E-mail de Acesso *</label>
                <input type="email" id="email" name="email" required placeholder="admin@sisvet.com">
            </div>

            <div class="campo">
                <label for="senha">Senha *</label>
                <input type="password" id="senha" name="senha" required placeholder="Digite uma senha segura">
            </div>

            <div class="acoes">
                <button type="submit" class="botao-salvar">Cadastrar Administrador</button>
            </div>
        </form>
    </main>
</body>
</html>
