    <header>
        <nav>
            <div style="display: flex; flex-direction: row; justify-content: space-between;">
                <div style="display: flex; flex-direction: row;">
                    <div style="display:flex; flex-direction: row; align-items: center;">
                        <i class="fa-solid fa-paw" style="font-size: 50px;"></i>
                    </div>
                    <div style=" line-height: 4px;">
                        <h2>SISVET</h2>
                        <p>Sistema integrado de Saúde Veterinária</p>
                    </div>
                </div>
                <div style="display: flex; flex-direction: row; align-items: center;">
                    <button id="buttonnotifications" onclick="window,location.href=''">
                        <i class="fa-regular fa-bell"></i>
                    </button>
                    <div style="display: flex; flex-direction: row; align-items: center; margin-left: 8px;">
                        <img src="img-user-default.webp" alt="default" style="height: 40px; border-radius: 20px;">
                        <div style="line-height: 1px; margin-right: 8px; margin-left: 4px;">
                            <h4 class="default-nome-user">default-nome-user</h4>
                            <h5 class="default-cargo">default-cargo</h5>
                        </div>
                        <button id="buttondropbar">
                            <i class="fa-solid fa-angle-down"></i>
                        </button>
                    </div>
                </div>
            </div>
        </nav>
    </header>
    <main style="margin-top: 40px; margin-left: 32px; margin-right: 32px;">
        <section id="sectionanimal">
            <div id="divpet">

                        <img src="img-user-default.webp" alt="default" style="height: 60px; border-radius: 30px; margin-right: 8px;">
                        <div style="line-height: 1px; margin-right: 8px; margin-left: 4px; gap: 0px; margin-top: 0px; display: flex; flex-direction: row; align-items: center;">
                            <div style="display: flex; flex-direction: column;">
                                <h4 class="default-nome-pet" style="margin-bottom: 0px;">default-nome-pet</h4>
                                <div style="display: flex; flex-direction: row; align-items: center; margin-top: 0px;">
                                    <h5 class="default-raca">default-raca</h5>
                                    <i class="fa-solid fa-minus"></i>
                                    <h5 class="default-ano">default-ano</h5>
                                </div>
                            </div>
                        </div>
                    </div>
                    <div>
                        <a href="">Ver detalhes do animal</a>
                    </div>
                </div>
            </div>
        </section>

                    <button class="buttonsdocument">Vacinação</button>
